<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜班 · 门房 | NIGHT DOORMAN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ════════════ 顶部状态条 ════════════ -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-cn">夜班 · 门房</span>
      <span class="brand-en">NIGHT DOORMAN</span>
    </div>
    <div class="topbar-mid">
      <div class="clockbox">
        <span id="clock">22:00</span>
        <div class="clockbar"><div id="clockfill"></div></div>
      </div>
      <button id="btn-rules" class="ghost-btn" type="button">守则手册 [R]</button>
    </div>
    <div class="topbar-right">
      <div class="stat"><b id="stat-night">1</b><span>夜班</span></div>
      <div class="stat"><b id="stat-passed">0</b><span>已放行</span></div>
      <div class="stat"><b id="stat-mistake">0</b><span>失误</span></div>
    </div>
  </header>

  <main>

    <!-- ════════════ 左：摄像头列表 ════════════ -->
    <aside id="camlist" class="panel">
      <div class="panel-head">监控通道</div>
      <div id="cam-buttons"></div>
      <div class="panel-foot">
        <span class="key">1</span><span class="key">2</span><span class="key">3</span><span class="key">4</span>
        <span class="foot-txt">切换通道</span>
      </div>
    </aside>

    <!-- ════════════ 中：监控画面 ════════════ -->
    <section id="stage">
      <div id="screen-frame">
        <canvas id="screen" width="680" height="384"></canvas>
        <div id="scanlines"></div>
        <div id="vignette"></div>
        <div id="screen-ui">
          <div class="rec"><i></i>REC</div>
          <div id="cam-name">CAM 1 · 大门外</div>
          <div id="cam-live">LIVE</div>
        </div>
        <div id="noise-overlay"></div>
        <div id="glitch-bar"></div>
      </div>
      <div id="underbar">
        <div id="prompt">走廊里很安静。门铃还没响。</div>
        <div id="prompt-sub">用左侧通道切换摄像头，检查楼内情况。</div>
      </div>
    </section>

    <!-- ════════════ 右：证件 + 登记册 + 判定 ════════════ -->
    <aside id="desk">

      <div class="panel" id="id-panel">
        <div class="panel-head">递交的证件 <span id="id-status" class="tag">空</span></div>
        <div id="id-empty" class="empty-hint">没有人递交证件。</div>
        <div id="id-card" class="hidden">
          <div class="id-photo-wrap">
            <canvas id="id-photo" width="120" height="150"></canvas>
            <div class="id-photo-tag">证件照</div>
          </div>
          <dl class="id-fields">
            <div><dt>姓名</dt><dd id="f-name">—</dd></div>
            <div><dt>房号</dt><dd id="f-room">—</dd></div>
            <div><dt>有效期</dt><dd id="f-date">—</dd></div>
            <div><dt>签发</dt><dd id="f-issue">—</dd></div>
          </dl>
          <div id="id-tamper" class="tamper hidden">⚠ 这一栏的字迹像是重新写过的</div>
        </div>
      </div>

      <div class="panel" id="log-panel">
        <div class="panel-head">楼栋登记册 <span id="log-count" class="tag">0 条</span></div>
        <div id="log-scroll">
          <table id="log-table">
            <thead>
              <tr><th>房号</th><th>姓名</th><th>有效期</th><th>备注</th></tr>
            </thead>
            <tbody id="log-body"></tbody>
          </table>
        </div>
      </div>

      <div class="panel" id="verify-panel">
        <div class="panel-head">核验清单</div>
        <ul id="checklist"></ul>
      </div>

      <div id="actions">
        <button id="btn-let" class="act let" type="button" disabled>放 行<small>Enter / ↑</small></button>
        <button id="btn-deny" class="act deny" type="button" disabled>拒 收<small>Backspace / ↓</small></button>
      </div>

    </aside>
  </main>

  <footer id="statusbar">
    <span id="status-text">值班开始。保持清醒。</span>
    <span id="hintbar">F 手电 · 空格 放大 · M 静音</span>
  </footer>
</div>

<!-- ════════════ 覆盖层：守则手册 ════════════ -->
<div id="rules-modal" class="modal hidden">
  <div class="modal-box">
    <h2>夜班门房守则</h2>
    <ol id="rules-list"></ol>
    <p class="modal-note">守则逐夜增加。在按下按钮之前，先确认每一条。</p>
    <button id="btn-rules-close" class="act" type="button">合上手册</button>
  </div>
</div>

<!-- ════════════ 覆盖层：开场 / 换夜 ════════════ -->
<div id="intro-modal" class="modal">
  <div class="modal-box wide">
    <h1 id="intro-title">夜班 · 门房</h1>
    <div id="intro-body"></div>
    <button id="btn-intro" class="act let" type="button">开始值班</button>
  </div>
</div>

<!-- ════════════ 覆盖层：结局 ════════════ -->
<div id="end-modal" class="modal hidden">
  <div class="modal-box wide">
    <h1 id="end-title">—</h1>
    <div id="end-body"></div>
    <button id="btn-end" class="act let" type="button">继续</button>
  </div>
</div>

<!-- ════════════ 覆盖层：惊吓 ════════════ -->
<div id="scare" class="hidden">
  <canvas id="scare-canvas" width="680" height="384"></canvas>
</div>

<script src="js/audio.js"></script>
<script src="js/visitor.js"></script>
<script src="js/camera.js"></script>
<script src="js/registry.js"></script>
<script src="js/game.js"></script>
</body>
</html>
